<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.5; }
      100% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    .float-badge {
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #38bdf8, #a855f7, #38bdf8);
      background-size: 200% auto;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="90" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="310" r="160" fill="#a855f7" opacity="0.09" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.14;0.08" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Circuit / Flow lines (IRT Trial Flow) -->
  <path d="M 720 120 L 820 120 L 870 170 L 960 170 L 1000 210 L 1100 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" class="flow-line" />
  <path d="M 720 280 L 800 280 L 850 230 L 940 230 L 980 190 L 1100 190" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.35" class="flow-line" />
  <path d="M 850 230 L 870 170" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 4" />

  <!-- Interactive Trial Nodes -->
  <g id="trialNodes">
    <!-- Stratification Node -->
    <circle cx="720" cy="120" r="7" fill="#38bdf8" filter="url(#subtleGlow)" class="pulse-circle">
      <animate attributeName="fill" values="#38bdf8;#60a5fa;#38bdf8" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="720" y="100" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">STRATIFICATION</text>

    <!-- Randomization Engine Node -->
    <rect x="830" y="145" width="80" height="50" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" />
    <text x="870" y="168" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RTSM</text>
    <text x="870" y="183" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">ALGORITHM</text>

    <!-- Arm A Node -->
    <circle cx="980" cy="120" r="6" fill="#10b981" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <path d="M 870 145 L 910 120 L 970 120" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
    <text x="1000" y="124" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ARM A (Active)</text>

    <!-- Arm B Node -->
    <circle cx="980" cy="260" r="6" fill="#f59e0b" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <path d="M 870 195 L 910 260 L 970 260" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5" />
    <text x="1000" y="264" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ARM B (Control)</text>

    <!-- Supply Depot Node -->
    <rect x="990" y="175" width="130" height="50" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="1055" y="196" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">GLOBAL DEPOT</text>
    <text x="1055" y="212" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Automated Resupply</text>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 68)" class="float-badge">
      <rect width="265" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">IRT &amp; RTSM ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Randomization
    </text>
    <text x="0" y="200" fill="url(#accentGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      &amp; Trial Supply (RTSM)
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="245" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      A curated guide to Interactive Response Technology (IRT), Patient Randomization,
    </text>
    <text x="0" y="270" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Clinical Supply Chain Forecasting, Drug Accountability &amp; Trial Blinding.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 305)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="57" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Rapid Startup</text>

      <!-- Tag 2 -->
      <rect x="125" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="187" y="17" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎲 Adaptive Trials</text>

      <!-- Tag 3 -->
      <rect x="260" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="327" y="17" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📦 Drug Tracking</text>

      <!-- Tag 4 -->
      <rect x="405" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="472" y="17" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔒 21 CFR Part 11</text>
    </g>
  </g>
</svg>